<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osnabrück Sensors</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --seq: #86b6ef,#6da7ec,#5598e7,#3987e5,#2a78d6,#256abf,#1c5cab,#184f95,#104281,#0d366b;
  --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --seq: #184f95,#1c5cab,#256abf,#2a78d6,#3987e5,#5598e7,#6da7ec,#86b6ef,#9ec5f4,#cde2fb;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --series-1: #3987e5;
  --seq: #184f95,#1c5cab,#256abf,#2a78d6,#3987e5,#5598e7,#6da7ec,#86b6ef,#9ec5f4,#cde2fb;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page); color: var(--text-primary);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); height: 100vh;
}
header label { max-width: 100%; }
#quantity { max-width: calc(100vw - 90px); }
main { grid-template-columns: minmax(0, 1fr) 380px; }
@media (max-width: 760px) { .busleg { display: none; } }
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface-1);
}
h1 { font-size: 16px; margin: 0; font-weight: 600; }
.sub { color: var(--text-secondary); font-size: 12px; }
#lineFilter { width: 150px; }
select, button, input[type=text], #lineFilter {
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px;
}
button { cursor: pointer; }
.spacer { flex: 1; }
#pollen { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
#map { min-height: 300px; background: var(--page); }
/* Recede the basemap so the data dots carry the color */
.tiles-light { filter: grayscale(1) contrast(0.85) brightness(1.08); }
.tiles-dark { filter: grayscale(1) invert(1) contrast(0.8) brightness(0.75); }
td.num.old { white-space: nowrap; }
aside { border-left: 1px solid var(--border); background: var(--surface-1); overflow: auto; padding: 12px 16px; }
@media (max-width: 760px) {
  body { height: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  #map { height: 60vh; }
  aside { border-left: 0; border-top: 1px solid var(--border); }
}
.legend { background: var(--surface-1); color: var(--text-primary); padding: 8px 10px; border-radius: 6px;
  border: 1px solid var(--border); font-size: 12px; min-width: 180px; }
.legend .bar { height: 10px; border-radius: 2px; margin: 4px 0 2px; }
.legend .ends { display: flex; justify-content: space-between; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.leaflet-tooltip.tip { background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
  box-shadow: 0 2px 8px rgba(0,0,0,.15); border-radius: 6px; padding: 6px 8px; }
.tip b { font-variant-numeric: tabular-nums; }
.tip .src { color: var(--muted); font-size: 11px; }
h2 { font-size: 15px; margin: 4px 0 2px; }
h3 { font-size: 13px; margin: 14px 0 6px; color: var(--text-secondary); font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
td, th { padding: 4px 4px; border-bottom: 1px solid var(--grid); text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover, tr.sel { background: color-mix(in srgb, var(--series-1) 10%, transparent); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.old { color: var(--muted); }
#chart { position: relative; }
#chart svg { display: block; width: 100%; height: 180px; overflow: visible; }
#chart .tt { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); white-space: nowrap; display: none; }
.ranges { display: flex; gap: 4px; margin: 6px 0; }
.ranges button[aria-pressed="true"] { border-color: var(--series-1); color: var(--series-1); }
a { color: var(--series-1); }
.err { color: var(--critical); font-size: 12px; }
/* Vehicles: line number in a pill, fill = punctuality status, delay printed beside the line */
.veh { display: inline-flex; align-items: center; gap: 3px; padding: 1px 5px; border-radius: 999px;
  font: 600 11px/14px system-ui, sans-serif; white-space: nowrap; color: #fff;
  border: 2px solid var(--surface-1); box-shadow: 0 1px 3px rgba(0,0,0,.3); transform: translate(-50%, -50%); }
.veh.train { border-radius: 3px; }
.veh.good { background: #0ca30c; } .veh.warning { background: #fab219; color: #0b0b0b; }
.veh.serious { background: #ec835a; color: #0b0b0b; } .veh.critical { background: #d03b3b; }
.veh .d { font-weight: 500; }
.veh.nolive { background: var(--surface-1); color: var(--text-secondary); border: 1.5px dashed var(--muted); }
.busleg div { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.busleg .veh { transform: none; border-width: 1px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Osnabrück Sensors</h1>
    <div class="sub" id="updated">loading…</div>
  </div>
  <label>Show <select id="quantity" aria-label="Measured quantity"></select></label>
  <label title="Estimated from live stop times (gtfs.de). Positions are interpolated between stops."><input type="checkbox" id="busToggle"> Buses &amp; trains <span class="sub" id="busCount"></span></label>
  <input id="lineFilter" list="lineList" placeholder="Lines, e.g. M3, RE18" aria-label="Show only these lines" autocomplete="off">
  <datalist id="lineList"></datalist>
  <div id="pollen" title="DWD pollen forecast for today, western Lower Saxony (0–3)"></div>
  <div class="spacer"></div>
  <button id="theme" title="Toggle light/dark">◐</button>
</header>
<main>
  <div id="map"></div>
  <aside id="panel"></aside>
</main>
<script>
const LABELS = {
  pm10: "Feinstaub PM10", pm2_5: "Feinstaub PM2.5", pm1: "Feinstaub PM1", pm4: "Feinstaub PM4",
  temperature: "Temperatur", humidity: "Luftfeuchte", relative_humidity: "Luftfeuchte (DWD)",
  pressure: "Luftdruck", pressure_msl: "Luftdruck (Meeresniveau)", dew_point: "Taupunkt",
  uv_intensity: "UV-Intensität", illuminance: "Beleuchtungsstärke", co2: "CO₂",
  gamma_dose_rate: "Gamma-Ortsdosisleistung", gamma_dose_rate_terrestrial: "Gamma-ODL (terrestrisch)",
  water_level: "Wasserstand", water_temperature: "Wassertemperatur", air_temperature: "Lufttemperatur (Pegel)",
  flow_speed: "Fließgeschwindigkeit", flow_direction: "Fließrichtung",
  precipitation_10: "Niederschlag 10 min", precipitation_60: "Niederschlag 1 h",
  solar_10: "Globalstrahlung 10 min", solar_60: "Globalstrahlung 1 h", sunshine_30: "Sonnenschein 30 min",
  sunshine_60: "Sonnenschein 1 h", wind_speed_10: "Windgeschwindigkeit", wind_direction_10: "Windrichtung",
  wind_gust_speed_10: "Böen", cloud_cover: "Bewölkung", visibility: "Sichtweite",
  wind_speed: "Windgeschwindigkeit (senseBox)", wind_direction: "Windrichtung (senseBox)", noise: "Lautstärke",
  o3: "Ozon", no2: "Stickstoffdioxid", uv_index_daily_max: "UV-Index (Tagesmax.)",
};
const SOURCES = { sensor_community: "Sensor.Community", opensensemap: "openSenseMap", dwd: "DWD",
  pegelonline: "Pegelonline (WSV)", bfs_odl: "BfS Radioaktivität", bfs_uv: "BfS UV", uba: "Umweltbundesamt",
  dwd_pollen: "DWD Pollen" };
const label = q => LABELS[q] || q.replace(/^osm_/, "").replace(/_/g, " ");
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = v => Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2).replace(/0$/, "");
const ago = ts => { const m = Math.round((Date.now() - Date.parse(ts)) / 60000);
  return m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = (p, q = {}) => fetch(`/api/${p}?` + new URLSearchParams(q)).then(r => r.json());
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// Theme toggle: explicit choice overrides the OS preference
const savedTheme = store.get("theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
const isDark = () => document.documentElement.dataset.theme
  ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;

// Canvas renderer: ~800 sensor dots stay smooth while panning
const map = L.map("map", { zoomControl: true, preferCanvas: true }).setView([52.09, 7.70], 9);
let tiles;
function setTiles() {
  if (tiles) map.removeLayer(tiles);
  tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, className: isDark() ? "tiles-dark" : "tiles-light",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
}
setTiles();
document.getElementById("theme").onclick = () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t; store.set("theme", t);
  setTiles(); render(); if (selected) showStation(selected.id, selected.quantity);
};

const legend = L.control({ position: "bottomleft" });
legend.onAdd = () => Object.assign(L.DomUtil.create("div", "legend"), { id: "legend" });
legend.addTo(map);

const layer = L.layerGroup().addTo(map);
let quantity = store.get("quantity") || "pm10", points = [], quantityList = [], selected = null, hours = 48;

// Sequential scale over the 5th–95th percentile so a single broken sensor doesn't flatten the map
function scale(values) {
  const s = [...values].sort((a, b) => a - b);
  const pick = p => s[Math.min(s.length - 1, Math.max(0, Math.round(p * (s.length - 1))))];
  let lo = pick(0.05), hi = pick(0.95);
  if (hi === lo) { lo -= 1; hi += 1; }
  const ramp = css("--seq").split(",").map(x => x.trim());
  const color = v => ramp[Math.round(Math.min(1, Math.max(0, (v - lo) / (hi - lo))) * (ramp.length - 1))];
  return { lo, hi, ramp, color };
}

function render() {
  layer.clearLayers();
  const unit = points[0]?.unit || "";
  const leg = document.getElementById("legend");
  if (!points.length) { leg.innerHTML = `<b>${esc(label(quantity))}</b><div class="sub">no current data</div>`; renderTable(null); return; }
  const sc = scale(points.map(p => p.value));
  leg.innerHTML = `<b>${esc(label(quantity))}</b> <span class="sub">${esc(unit)} · ${points.length} stations</span>
    <div class="bar" style="background:linear-gradient(90deg,${sc.ramp.join(",")})"></div>
    <div class="ends"><span>≤ ${fmt(sc.lo)}</span><span>≥ ${fmt(sc.hi)}</span></div>`;
  for (const p of points) {
    const m = L.circleMarker([p.lat, p.lon], {
      radius: 7, weight: 2, color: css("--surface-1"), fillColor: sc.color(p.value), fillOpacity: 1,
    }).addTo(layer);
    m.bindTooltip(`${esc(p.name)}<br><b>${fmt(p.value)} ${esc(p.unit || "")}</b> <span class="src">${ago(p.ts)} ago</span>
      <div class="src">${esc(SOURCES[p.source] || p.source)}</div>`, { className: "tip", direction: "top", offset: [0, -6] });
    m.on("click", () => showStation(p.id, quantity));
  }
  if (!selected) renderTable(sc);
}

function renderTable(sc) {
  const panel = document.getElementById("panel");
  if (!sc) { panel.innerHTML = `<h2>${esc(label(quantity))}</h2><p class="sub">No readings in the last 6 hours.</p>`; return; }
  const rows = [...points].sort((a, b) => b.value - a.value);
  panel.innerHTML = `<h2>${esc(label(quantity))}</h2>
    <div class="sub">All ${rows.length} stations, highest first. Click a row or a dot for details.</div>
    <table><thead><tr><th>Station</th><th class="num">${esc(rows[0].unit || "")}</th><th class="num">Age</th></tr></thead><tbody>
    ${rows.map(p => `<tr class="click" data-id="${esc(p.id)}"><td><span class="swatch" style="background:${sc.color(p.value)}"></span>${esc(p.name)}
      <div class="sub">${esc(SOURCES[p.source] || p.source)}</div></td><td class="num">${fmt(p.value)}</td>
      <td class="num old">${ago(p.ts)}</td></tr>`).join("")}</tbody></table>`;
  panel.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => {
    const p = points.find(x => x.id === tr.dataset.id); map.panTo([p.lat, p.lon]); showStation(p.id, quantity);
  });
}

async function showStation(id, q) {
  selected = { id, quantity: q };
  const st = await api("station", { id });
  if (!st) return;
  const has = st.latest.some(l => l.quantity === q);
  if (!has) selected.quantity = st.latest[0]?.quantity;
  const panel = document.getElementById("panel");
  const link = st.meta.graph ? `<a href="${esc(st.meta.graph)}" target="_blank" rel="noopener">BfS daily curve</a>` : "";
  panel.innerHTML = `<button id="back">← All stations</button>
    <h2>${esc(st.name)}</h2>
    <div class="sub">${esc(SOURCES[st.source] || st.source)} · ${st.lat?.toFixed(4)}, ${st.lon?.toFixed(4)} ${link}</div>
    <h3 id="ctitle"></h3>
    <div class="ranges">${[24, 48, 168].map(h => `<button data-h="${h}" aria-pressed="${h === hours}">${h < 168 ? h + " h" : "7 d"}</button>`).join("")}</div>
    <div id="chart"></div>
    <h3>Latest values</h3>
    <table><tbody>${st.latest.map(l => `<tr class="click${l.quantity === selected.quantity ? " sel" : ""}" data-q="${esc(l.quantity)}">
      <td>${esc(label(l.quantity))}</td><td class="num">${fmt(l.value)} ${esc(l.unit || "")}</td>
      <td class="num old">${ago(l.ts)}</td></tr>`).join("")}</tbody></table>`;
  document.getElementById("back").onclick = () => { selected = null; render(); };
  panel.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => showStation(id, tr.dataset.q));
  panel.querySelectorAll(".ranges button").forEach(b => b.onclick = () => { hours = +b.dataset.h; showStation(id, selected.quantity); });
  const unit = st.latest.find(l => l.quantity === selected.quantity)?.unit || "";
  document.getElementById("ctitle").textContent = `${label(selected.quantity)}${unit ? " (" + unit + ")" : ""}`;
  drawChart(await api("series", { id, quantity: selected.quantity, hours }), unit);
}

function drawChart(data, unit) {
  const el = document.getElementById("chart");
  if (data.length < 2) { el.innerHTML = `<div class="sub">Not enough history yet (${data.length} reading${data.length === 1 ? "" : "s"}). The collector adds a point every 10 minutes.</div>`; return; }
  const W = el.clientWidth || 340, H = 180, m = { l: 40, r: 8, t: 8, b: 22 };
  const xs = data.map(d => Date.parse(d[0])), ys = data.map(d => d[1]);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); if (y0 === y1) { y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad;
  const x0 = xs[0], x1 = xs[xs.length - 1];
  const X = t => m.l + (t - x0) / (x1 - x0 || 1) * (W - m.l - m.r), Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  const ticks = [0, 1, 2, 3].map(i => y0 + (y1 - y0) * i / 3);
  const tfmt = t => new Date(t).toLocaleString("de-DE", x1 - x0 > 2 * 864e5 ? { weekday: "short", day: "numeric" } : { hour: "2-digit", minute: "2-digit" });
  const xt = [0, 0.5, 1].map(f => x0 + (x1 - x0) * f);
  const path = data.map((d, i) => `${i ? "L" : "M"}${X(xs[i]).toFixed(1)},${Y(d[1]).toFixed(1)}`).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart">
    ${ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css("--grid")}" stroke-width="1"/>
      <text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="${css("--muted")}">${fmt(v)}</text>`).join("")}
    <line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="${css("--axis")}"/>
    ${xt.map((t, i) => `<text x="${X(t)}" y="${H - 6}" text-anchor="${["start", "middle", "end"][i]}" font-size="11" fill="${css("--muted")}">${tfmt(t)}</text>`).join("")}
    <path d="${path}" fill="none" stroke="${css("--series-1")}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="xh" y1="${m.t}" y2="${H - m.b}" stroke="${css("--axis")}" visibility="hidden"/>
    <circle id="dot" r="4" fill="${css("--series-1")}" stroke="${css("--surface-1")}" stroke-width="2" visibility="hidden"/>
    <rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent" id="hit"/>
  </svg><div class="tt"></div>`;
  const svg = el.querySelector("svg"), tt = el.querySelector(".tt"), xh = svg.querySelector("#xh"), dot = svg.querySelector("#dot");
  const hit = svg.querySelector("#hit");
  hit.onpointermove = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const t = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    let i = 0; for (let k = 1; k < xs.length; k++) if (Math.abs(xs[k] - t) < Math.abs(xs[i] - t)) i = k;
    const cx = X(xs[i]), cy = Y(ys[i]);
    xh.setAttribute("x1", cx); xh.setAttribute("x2", cx); xh.setAttribute("visibility", "visible");
    dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("visibility", "visible");
    tt.innerHTML = `<b>${fmt(ys[i])} ${esc(unit)}</b><br><span class="sub">${new Date(xs[i]).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })}</span>`;
    tt.style.display = "block";
    const left = cx * r.width / W; tt.style.left = Math.min(r.width - tt.offsetWidth, Math.max(0, left - tt.offsetWidth / 2)) + "px";
    tt.style.top = Math.max(0, cy * r.height / H - 48) + "px";
  };
  hit.onpointerleave = () => { tt.style.display = "none"; xh.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); };
}

async function loadQuantities() {
  quantityList = await api("quantities");
  if (!quantityList.some(q => q.quantity === quantity) && quantityList.length) quantity = quantityList[0].quantity;
  const sel = document.getElementById("quantity");
  sel.innerHTML = quantityList.map(q => `<option value="${esc(q.quantity)}"${q.quantity === quantity ? " selected" : ""}>
    ${esc(label(q.quantity))} (${q.stations})</option>`).join("");
  sel.onchange = () => { quantity = sel.value; store.set("quantity", quantity); selected = null; refresh(); };
}

async function refresh() {
  try {
    const [pts, st] = await Promise.all([api("latest", { quantity }), api("status")]);
    points = pts;
    const errs = st.sources.filter(s => s.error).map(s => SOURCES[s.source] || s.source);
    document.getElementById("updated").innerHTML = st.last_run
      ? `Last collection ${new Date(st.last_run).toLocaleTimeString("de-DE", { timeStyle: "short" })} · ${st.sources.reduce((a, s) => a + s.stations, 0)} stations`
        + (errs.length ? ` · <span class="err">failed: ${esc(errs.join(", "))}</span>` : "")
      : "no data yet";
    document.getElementById("pollen").innerHTML = st.pollen.filter(p => p.value > 0).map(p =>
      `<span class="chip">${esc(p.quantity.replace("pollen_", ""))} ${p.value}</span>`).join("")
      || (st.pollen.length ? `<span class="chip">Pollen: none today</span>` : "");
    render();
  } catch (e) {
    document.getElementById("updated").innerHTML = `<span class="err">Server not reachable</span>`;
  }
}

// --- Buses & trains: server sends each vehicle's current segment, we animate along it every second ---
const busLayer = L.layerGroup();
const busLegend = L.control({ position: "bottomright" });
busLegend.onAdd = () => {
  const d = L.DomUtil.create("div", "legend busleg");
  d.innerHTML = `<b>Punctuality</b> <span class="sub">estimated position</span>
    <div><span class="veh good">M1</span> on time (&lt; 2 min)</div>
    <div><span class="veh warning">M1 <span class="d">+3</span></span> 2–4 min late</div>
    <div><span class="veh serious">M1 <span class="d">+7</span></span> 5–9 min late</div>
    <div><span class="veh critical">M1 <span class="d">+12</span></span> 10+ min late</div>
    <div><span class="veh nolive">M3</span> timetable only, no live data</div>
    <div><span class="veh train good">RE18</span> train</div>
    <div class="sub">Zoomed out: coloured dots. Zoom in for line numbers.</div>`;
  return d;
};
let vehicles = [], clockOffset = 0, busTimer = null, busPoll = null, renderedAsDots = null;
const markers = new Map();
const STATUS = { good: "#0ca30c", warning: "#fab219", serious: "#ec835a", critical: "#d03b3b" };
// Zoomed out over the Ruhr there are thousands of vehicles: draw coloured dots, line labels from zoom 12
const dotMode = () => map.getZoom() < 12;
let moveTimer;
map.on("moveend", () => { if (busToggle.checked) { clearTimeout(moveTimer); moveTimer = setTimeout(loadBuses, 300); } });
const statusOf = s => s < 120 ? "good" : s < 300 ? "warning" : s < 600 ? "serious" : "critical";
const isTrain = v => v.type !== 3 && !(v.type >= 700 && v.type < 800);

function vehPos(v, now) {
  const f = v.arr > v.dep ? Math.min(1, Math.max(0, (now - v.dep) / (v.arr - v.dep))) : 1;
  return [v.from[0] + (v.to[0] - v.from[0]) * f, v.from[1] + (v.to[1] - v.from[1]) * f];
}

function vehIcon(v) {
  const min = Math.round((v.delay || 0) / 60);
  const cls = v.live ? statusOf(v.delay || 0) : "nolive";
  return L.divIcon({ className: "", iconSize: null,
    html: `<span class="veh ${cls}${isTrain(v) ? " train" : ""}">${esc(v.line)}${v.live && min >= 2 ? ` <span class="d">+${min}</span>` : ""}</span>` });
}

function vehTip(v) {
  const min = Math.round((v.delay || 0) / 60);
  const late = !v.live ? "timetable position (no live data)"
    : min >= 1 ? `${min} min late` : min <= -1 ? `${-min} min early` : "on time";
  return `<b>${esc(v.line)}</b> → ${esc(v.headsign)}<br>${esc(v.prev_stop)} → ${esc(v.next_stop)}
    <br><b>${late}</b><div class="src">${esc(v.agency)}</div>`;
}

// Line filter: comma/space separated, case- and space-insensitive ("re 18" matches "RE18")
const norm = s => String(s).toUpperCase().replace(/\s+/g, "");
const lineFilter = document.getElementById("lineFilter");
lineFilter.value = store.get("lines") || "";
const wanted = () => lineFilter.value.split(/[\s,;]+/).filter(Boolean).reduce((out, p) => {
  // "RE 18" arrives as "RE", "18": glue a number onto a preceding letters-only token
  if (/^\d+$/.test(p) && /^[A-Za-z]+$/.test(out[out.length - 1] || "")) out[out.length - 1] += p; else out.push(p);
  return out;
}, []).map(norm);
const matches = v => { const w = wanted(); return !w.length || w.includes(norm(v.line)); };

function applyFilter() {
  let shown = 0;
  for (const v of vehicles) {
    const m = markers.get(v.trip);
    if (!m) continue;
    if (matches(v)) { shown++; if (!busLayer.hasLayer(m)) m.addTo(busLayer); }
    else busLayer.removeLayer(m);
  }
  const live = vehicles.filter(v => v.live && matches(v)).length;
  document.getElementById("busCount").textContent = wanted().length
    ? `(${shown} of ${vehicles.length} in view, ${live} live)` : `(${vehicles.length} in view, ${live} live)`;
}
lineFilter.oninput = () => { store.set("lines", lineFilter.value); applyFilter(); };

function animateBuses() {
  const now = Date.now() / 1000 + clockOffset;
  for (const v of vehicles) markers.get(v.trip)?.setLatLng(vehPos(v, now));
}

async function loadBuses() {
  try {
    const b = map.getBounds().pad(0.3);
    const res = await api("buses", { bbox: [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map(x => x.toFixed(4)).join(",") });
    clockOffset = res.now - Date.now() / 1000;
    vehicles = res.vehicles;
    const dots = dotMode();
    if (dots !== renderedAsDots) { busLayer.clearLayers(); markers.clear(); renderedAsDots = dots; }
    const seen = new Set(vehicles.map(v => v.trip));
    for (const [id, m] of markers) if (!seen.has(id)) { busLayer.removeLayer(m); markers.delete(id); }
    for (const v of vehicles) {
      let m = markers.get(v.trip);
      if (!m) {
        m = dots ? L.circleMarker(vehPos(v, res.now), { radius: 4, weight: 1, color: css("--surface-1"), fillOpacity: 1 })
                 : L.marker(vehPos(v, res.now), { zIndexOffset: 1000, keyboard: false });
        markers.set(v.trip, m);
      }
      if (dots) m.setStyle({ fillColor: v.live ? STATUS[statusOf(v.delay || 0)] : css("--muted") });
      else m.setIcon(vehIcon(v));
      m.bindTooltip(vehTip(v), { className: "tip", direction: "top", offset: [0, dots ? -4 : -10] });
    }
    const lines = [...new Set(vehicles.map(v => v.line))].sort((a, b) => a.localeCompare(b, "de", { numeric: true }));
    document.getElementById("lineList").innerHTML = lines.map(l => `<option value="${esc(l)}">`).join("");
    applyFilter();
    if (res.loading) document.getElementById("busCount").textContent = "(loading timetable…)";
    else if (res.error) document.getElementById("busCount").textContent += " feed error";
  } catch (e) {
    document.getElementById("busCount").textContent = "(unavailable)";
  }
}

function setBuses(on) {
  store.set("buses", on ? "1" : "0");
  clearInterval(busTimer); clearInterval(busPoll);
  if (on) {
    busLayer.addTo(map); busLegend.addTo(map);
    loadBuses(); busPoll = setInterval(loadBuses, 30000); busTimer = setInterval(animateBuses, 1000);
  } else {
    map.removeLayer(busLayer); busLegend.remove(); document.getElementById("busCount").textContent = "";
  }
}
const busToggle = document.getElementById("busToggle");
busToggle.checked = store.get("buses") !== "0";
busToggle.onchange = () => setBuses(busToggle.checked);
setBuses(busToggle.checked);

loadQuantities().then(refresh);
setInterval(() => loadQuantities().then(refresh), 60000);
</script>
</body>
</html>
